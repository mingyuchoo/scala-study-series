<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #f5f5f5;
        }
        h1, h2, h3 {
            color: #333;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .post {
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .post:last-child {
            border-bottom: none;
        }
        .post-title {
            margin-bottom: 5px;
        }
        .post-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .post-content {
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            min-height: 150px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            margin-bottom: 10px;
        }
        .success {
            color: green;
            margin-bottom: 10px;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .edit-button {
            background-color: #2196F3;
        }
        .edit-button:hover {
            background-color: #0b7dda;
        }
        .delete-button {
            background-color: #f44336;
        }
        .delete-button:hover {
            background-color: #da190b;
        }
        
        .post-tags {
            margin-bottom: 10px;
        }
        
        .tag {
            display: inline-block;
            background-color: #e0e0e0;
            color: #333;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        
        .search-container {
            display: flex;
            margin-bottom: 20px;
            gap: 10px;
        }
        
        #search-input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        #search-button {
            background-color: #2196F3;
        }
        
        #clear-search-button {
            background-color: #9e9e9e;
        }
    </style>
</head>
<body>
    <h1>Blog Service</h1>
    
    <div class="container">
        <h2>Create New Post</h2>
        <div id="message"></div>
        <form id="post-form">
            <input type="hidden" id="post-id">
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label for="author">Author:</label>
                <input type="text" id="author" required>
            </div>
            <div class="form-group">
                <label for="tags">Tags (comma separated):</label>
                <input type="text" id="tags" placeholder="e.g., scala, programming, web">
            </div>
            <div class="form-group">
                <label for="content">Content:</label>
                <textarea id="content" required></textarea>
            </div>
            <div class="button-group">
                <button type="submit" id="submit-button">Create Post</button>
                <button type="button" id="cancel-button" style="display:none;">Cancel</button>
            </div>
        </form>
    </div>
    
    <div class="container">
        <h2>Posts</h2>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search posts...">
            <button id="search-button">Search</button>
            <button id="clear-search-button">Clear</button>
        </div>
        <div id="posts-container"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const postForm = document.getElementById('post-form');
            const postsContainer = document.getElementById('posts-container');
            const messageDiv = document.getElementById('message');
            const submitButton = document.getElementById('submit-button');
            const cancelButton = document.getElementById('cancel-button');
            const postIdInput = document.getElementById('post-id');
            const titleInput = document.getElementById('title');
            const authorInput = document.getElementById('author');
            const contentInput = document.getElementById('content');
            const tagsInput = document.getElementById('tags');
            const searchInput = document.getElementById('search-input');
            const searchButton = document.getElementById('search-button');
            const clearSearchButton = document.getElementById('clear-search-button');
            
            // Load all posts when page loads
            fetchPosts();
            
            // Handle search button click
            searchButton.addEventListener('click', function() {
                const searchTerm = searchInput.value.trim();
                if (searchTerm) {
                    searchPosts(searchTerm);
                } else {
                    showMessage('Please enter a search term', 'error');
                }
            });
            
            // Handle clear search button click
            clearSearchButton.addEventListener('click', function() {
                searchInput.value = '';
                fetchPosts();
            });
            
            // Handle search on Enter key press
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const searchTerm = searchInput.value.trim();
                    if (searchTerm) {
                        searchPosts(searchTerm);
                    } else {
                        showMessage('Please enter a search term', 'error');
                    }
                }
            });
            
            // Handle form submission
            postForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const post = {
                    title: titleInput.value,
                    author: authorInput.value,
                    content: contentInput.value,
                    tags: tagsInput.value.split(',').map(tag => tag.trim()).filter(tag => tag !== '').join(';')
                };
                
                const postId = postIdInput.value;
                
                if (postId) {
                    // Update existing post
                    post.id = parseInt(postId);
                    updatePost(post);
                } else {
                    // Create new post
                    createPost(post);
                }
            });
            
            // Handle cancel button
            cancelButton.addEventListener('click', function() {
                resetForm();
            });
            
            // Fetch all posts
            function fetchPosts() {
                fetch('/api/posts')
                    .then(response => response.json())
                    .then(posts => {
                        displayPosts(posts);
                    })
                    .catch(error => {
                        showMessage('Error loading posts: ' + error.message, 'error');
                    });
            }
            
            // Display posts
            function displayPosts(posts) {
                postsContainer.innerHTML = '';
                
                if (posts.length === 0) {
                    postsContainer.innerHTML = '<p>No posts available.</p>';
                    return;
                }
                
                posts.forEach(post => {
                    const postElement = document.createElement('div');
                    postElement.className = 'post';
                    postElement.innerHTML = `
                        <h3 class="post-title">${post.title}</h3>
                        <div class="post-meta">By ${post.author} on ${formatDate(post.createdAt)}</div>
                        <div class="post-tags">${renderTags(post.tags)}</div>
                        <div class="post-content">${post.content}</div>
                        <div class="button-group">
                            <button class="edit-button" data-id="${post.id}">Edit</button>
                            <button class="delete-button" data-id="${post.id}">Delete</button>
                        </div>
                    `;
                    postsContainer.appendChild(postElement);
                    
                    // Add event listeners for edit and delete buttons
                    postElement.querySelector('.edit-button').addEventListener('click', function() {
                        editPost(post);
                    });
                    
                    postElement.querySelector('.delete-button').addEventListener('click', function() {
                        deletePost(post.id);
                    });
                });
            }
            
            // Create a new post
            function createPost(post) {
                fetch('/api/posts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(post)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to create post');
                    }
                    return response.json();
                })
                .then(newPost => {
                    showMessage('Post created successfully!', 'success');
                    resetForm();
                    fetchPosts();
                })
                .catch(error => {
                    showMessage('Error creating post: ' + error.message, 'error');
                });
            }
            
            // Update an existing post
            function updatePost(post) {
                fetch(`/api/posts/${post.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(post)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to update post');
                    }
                    return response.json();
                })
                .then(updatedPost => {
                    showMessage('Post updated successfully!', 'success');
                    resetForm();
                    fetchPosts();
                })
                .catch(error => {
                    showMessage('Error updating post: ' + error.message, 'error');
                });
            }
            
            // Delete a post
            function deletePost(id) {
                if (confirm('Are you sure you want to delete this post?')) {
                    fetch(`/api/posts/${id}`, {
                        method: 'DELETE'
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Failed to delete post');
                        }
                        return response.text();
                    })
                    .then(() => {
                        showMessage('Post deleted successfully!', 'success');
                        fetchPosts();
                    })
                    .catch(error => {
                        showMessage('Error deleting post: ' + error.message, 'error');
                    });
                }
            }
            
            // Edit a post (populate form)
            function editPost(post) {
                postIdInput.value = post.id;
                titleInput.value = post.title;
                authorInput.value = post.author;
                contentInput.value = post.content;
                tagsInput.value = post.tags ? post.tags.split(';').join(', ') : '';
                
                submitButton.textContent = 'Update Post';
                cancelButton.style.display = 'block';
                
                // Scroll to form
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            
            // Reset form
            function resetForm() {
                postForm.reset();
                postIdInput.value = '';
                submitButton.textContent = 'Create Post';
                cancelButton.style.display = 'none';
            }
            
            // Show message
            function showMessage(message, type) {
                messageDiv.textContent = message;
                messageDiv.className = type;
                
                // Clear message after 3 seconds
                setTimeout(() => {
                    messageDiv.textContent = '';
                    messageDiv.className = '';
                }, 3000);
            }
            
            // Format date
            function formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleString();
            }
            
            // Render tags
            function renderTags(tags) {
                if (!tags || tags === '') return '';
                const tagList = tags.split(';').filter(tag => tag.trim() !== '');
                if (tagList.length === 0) return '';
                return tagList.map(tag => `<span class="tag">${tag.trim()}</span>`).join(' ');
            }
            
            // Search posts
            function searchPosts(term) {
                fetch(`/api/posts/search/${encodeURIComponent(term)}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Search failed');
                        }
                        return response.json();
                    })
                    .then(posts => {
                        displayPosts(posts);
                        if (posts.length === 0) {
                            showMessage(`No posts found matching '${term}'`, 'info');
                        } else {
                            showMessage(`Found ${posts.length} posts matching '${term}'`, 'success');
                        }
                    })
                    .catch(error => {
                        showMessage('Error searching posts: ' + error.message, 'error');
                    });
            }
        });
    </script>
</body>
</html>
